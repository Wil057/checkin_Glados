name: GLaDOS daily check-in

on:
  workflow_dispatch:
  schedule:
    # 08:23 Beijing time; GitHub may delay scheduled runs.
    - cron: '23 0 * * *'

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          NOTIFY: ${{ secrets.NOTIFY }}

